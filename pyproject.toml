[project]
name = "friendlynode"
version = "0.0.1"
description = "Lightweight Reticulum/LXMF/NomadNet web client skeleton"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
friendlynode-controller = "friendlynode.controller.main:main"
friendlynode-engine = "friendlynode.engine.engine_main:main"
friendlynode-launcher = "friendlynode.launcher.desktop_launcher:main"
friendlynode-access = "friendlynode.access_starter:main"

[tool.pyright]
pythonVersion = "3.11"
include = ["friendlynode"]

[tool.ruff]
line-length = 100
target-version = "py311"
